# XYZ-SOUND for MPC OS -- page layout (mpc-vst-plugins layout.conf syntax). Coordinates are Force Shadow pixels: the plugin area is
# x 0..1280, y 86..714 (skin y = shadow y - 86). The pad is drawn by the plugin itself in the 600 x 600 box at page x 340, y 14
# (pad/layout.txt), so no control sits there. Text sizes: Meta4MPCXXL 0.1.2 (label_scale 1.7, scale_names 1).
scale_names=1
label_scale=1.7
theme_bg=000000
theme_panel=000000
theme_line=3a3a3a
theme_ink=ffffff
theme_ink_dim=ffffff
theme_ink_faint=ffffff
theme_accent=3a3a3a
theme_accent_hi=ffffff
theme_knob_face=1c1c1c
theme_knob_ring=3a3a3a
theme_knob_dot=ffffff

[tab XYZ-SOUND]
knob cx=160 cy=400 r=58 label="CUTOFF" key=x
knob cx=1120 cy=400 r=58 label="RES" key=y
knob cx=160 cy=177 r=58 label="PITCH" key=circ
knob cx=1120 cy=177 r=58 label="VOLUME" key=vol
qlinks "XYZ-SOUND" = x,y,circ,vol
